# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
early_access: false
reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  review_status: true
  poem: false
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  path_instructions:
    - path: "src/**/*.cs"
      instructions: >-
        Public C# 14 / .NET 10 library. Enforce as blocking: idiomatic modern C#
        (collection expressions, primary constructors, pattern matching);
        correct async/await with no sync-over-async and a CancellationToken
        threaded through every public async method; nullable-reference
        correctness (NRTs are enabled, warnings are errors); sealed by default;
        XML doc comments on every public type and member. Flag any line that is
        less clear than it could be. This is a safety-evaluation tool: treat
        scenario and run-result text as untrusted when it flows into judge or
        reviewer prompts, into file paths, or into process arguments.
    - path: "tests/**/*.cs"
      instructions: >-
        Tests must pin behavior, not line coverage. Reject vague assertions
        (toBeTruthy-style checks, "it ran" with no observed effect). Every test
        should fail under a plausible mutation of the code it exercises; if it
        would not, say which mutation it survives.
    - path: ".github/workflows/**"
      instructions: >-
        Pin actions, keep secrets out of logs, and prefer least-privilege
        permissions. The observability and Foundry-sample gates must stay
        runnable without any API key.
  tools:
    github-checks:
      enabled: true
chat:
  auto_reply: true
